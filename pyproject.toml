[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scraping"
version = "0.1"
description = "Local-first resource acquisition and web scraping capability for FlossWare"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "FlossWare"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/FlossWare/scraping"
Repository = "https://github.com/FlossWare/scraping"
Issues = "https://github.com/FlossWare/scraping/issues"

[project.optional-dependencies]
dev = ["build", "pytest"]

[project.scripts]
scrape = "scraping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
